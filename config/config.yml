source:
  base_url: "https://pokeapi.co"
  endpoint: "/api/v2/pokemon"
  page_size: 20

target:
  catalog: "pokemon"
  bronze_schema: "bronze"
  silver_schema: "silver"
  gold_schema: "gold"

silver:
  datasets:
    pokemon:
      source_entity: "pokemon"
      target_table: "pokemon"
      load_strategy: "snapshot_merge"
      keys:
        - pokemon_id

    pokemon_types:
      source_entity: "types"
      target_table: "pokemon_types"
      load_strategy: "snapshot_merge"
      keys:
        - pokemon_id
        - slot

    pokemon_abilities:
      source_entity: "abilities"
      target_table: "pokemon_abilities"
      load_strategy: "snapshot_merge"
      keys:
        - pokemon_id
        - slot

    pokemon_stats:
      source_entity: "stats"
      target_table: "pokemon_stats"
      load_strategy: "snapshot_merge"
      keys:
        - pokemon_id
        - stat_name

    pokemon_moves:
      source_entity: "moves"
      target_table: "pokemon_moves"
      load_strategy: "snapshot_merge"
      keys:
        - pokemon_id
        - move_name

    pokemon_move_details:
      source_entity: "move_details"
      target_table: "pokemon_move_details"
      load_strategy: "snapshot_merge"
      keys:
        - pokemon_id
        - move_name
        - version_group_name
        - learn_method_name
        - level_learned_at
        - learn_order

    pokemon_forms:
      source_entity: "forms"
      target_table: "pokemon_forms"
      load_strategy: "snapshot_merge"
      keys:
        - pokemon_id
        - form_name

    pokemon_game_indices:
      source_entity: "game_indices"
      target_table: "pokemon_game_indices"
      load_strategy: "snapshot_merge"
      keys:
        - pokemon_id
        - version_name


gold:
  dimensions:
    dim_pokemon:
      source_table: pokemon
      natural_key: [pokemon_id]
      surrogate_key: pokemon_key
      load_strategy: scd2
      tracked_columns:
        - name
        - base_experience
        - height
        - weight
        - is_default
        - pokemon_order
        - species_name
        - species_url

    dim_type:
      source_table: pokemon_types
      natural_key: [type_url]
      surrogate_key: type_key
      load_strategy: upsert
      attributes: [type_name]

    dim_ability:
      source_table: pokemon_abilities
      natural_key: [ability_url]
      surrogate_key: ability_key
      load_strategy: upsert
      attributes: [ability_name]

    dim_move:
      source_table: pokemon_moves
      natural_key: [move_url]
      surrogate_key: move_key
      load_strategy: upsert
      attributes: [move_name]

    dim_form:
      source_table: pokemon_forms
      natural_key: [form_url]
      surrogate_key: form_key
      load_strategy: upsert
      attributes: [form_name]

    dim_version_group:
      source_table: pokemon_move_details
      natural_key: [version_group_url]
      surrogate_key: version_group_key
      load_strategy: upsert
      attributes: [version_group_name]

    dim_learn_method:
      source_table: pokemon_move_details
      natural_key: [learn_method_url]
      surrogate_key: learn_method_key
      load_strategy: upsert
      attributes: [learn_method_name]

    dim_game_version:
      source_table: pokemon_game_indices
      natural_key: [version_url]
      surrogate_key: game_version_key
      load_strategy: upsert
      attributes: [version_name]

    dim_stat:
      source_table: pokemon_stats
      natural_key: [stat_url]
      surrogate_key: stat_key
      load_strategy: upsert
      attributes: [stat_name]
